<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Messages Spam Filter</h1>
  <label class="row"><input type="checkbox" id="enabled"> Watch new threads</label>
  <label class="row"><input type="checkbox" id="dryRun"> Dry run (log only, never delete)</label>
  <div class="buttons">
    <button id="scan">Scan now</button>
    <button id="checkPictures" title="Open picture threads that are waiting, so their pictures get checked now. Opening marks them read.">Check pictures now</button>
    <button id="trashSpam" title="Move every existing thread labelled spam to trash. Needs dry run off.">Trash existing spam</button>
    <button id="checkTop" title="Re-check the top threads as if they were new. Deletes spam among them unless dry run is on.">Check top threads</button>
    <button id="diagnose">Diagnose page</button>
    <button id="options">Settings</button>
    <button id="clear">Clear</button>
    <button id="reload" title="Reload the extension and the Messages tabs, picking up code changes.">Reload</button>
  </div>
  <div id="status" class="muted"></div>
  <div id="reportBox" hidden>
    <div class="buttons"><button id="copyReport">Copy</button><button id="closeReport">Close</button></div>
    <pre id="report"></pre>
  </div>
  <h2>Last scan <span class="muted" id="scanTime"></span></h2>
  <div id="scanSummary" class="muted"></div>
  <ul class="log" id="scanList"></ul>
  <h2>Activity</h2>
  <ul class="log" id="log"></ul>
  <script type="module" src="panel.js"></script>
</body>
</html>
