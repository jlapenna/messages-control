# Repository-owned: scan full history for every event, including forks.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PR revisions supersede each other, but every main revision must retain a
  # full-history scan: cancelling an earlier main run can leave a secret from
  # that commit outside the replacement run's diff range.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz -o "$audit_dir/gitleaks.tar.gz"
          echo '6298c9235dfc9278c14b28afd9b7fa4e6f4a289cb1974bd27949fc1e9122bdee  '"$audit_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$audit_dir/gitleaks.tar.gz" -C "$audit_dir" gitleaks
          echo "$audit_dir" >> "$GITHUB_PATH"
      - name: Scan full Git history
        run: ./tools/scan-secrets.sh
