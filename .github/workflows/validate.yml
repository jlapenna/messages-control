# fleet-onboard: managed by jlapenna/agent-lcars tools/fleet-onboard.mjs. Re-run it to refresh; delete this line to own the file locally.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The job key composes the required check name "validate / repository
  # validation" (docs/published-actions.md in jlapenna/agent-lcars).
  validate:
    uses: jlapenna/agent-lcars/.github/workflows/repo-validation.yml@main # latest
