name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: for f in *.js src/*.js bin/*.js; do node --check "$f"; done
      - run: node -e 'JSON.parse(require("fs").readFileSync("manifest.json"))'
      - run: npm test
      # End to end against a mock Messages page (test/integration): the real
      # CLI, headless Chromium and page driver. Part of the required "test"
      # check on purpose: one consumer, one lane.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - run: npm ci --prefix desktop --ignore-scripts
      - run: npm run test:desktop
